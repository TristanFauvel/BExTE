name: Aprepitant
control: Ondansetron
summary_measure_likelihood: binomial
theta_0: 0
endpoint: binary
null_space: left
sampling_approximation: FALSE

# Paediatric trial of Salman et al. (2019), table 6: complete response in 48/57
# (84.2%) on aprepitant 125 mg, the adult source trial's dose, and 42/52 (80.8%)
# on ondansetron. Jin et al. (2021) print 48/55, the 40 mg arm's denominator.
target:
    control: 52
    treatment: 57
    total: 109
    responses:
      control: 42
      treatment: 48
    treatment_effect: 0.03441295546558698 #difference in proportions: (48/57) - (42/52)
    standard_error: 0.072936 # The standard error on the difference of two proportions is given by: SE(p1- p2)= sqrt(p1*(1-p1)/n1 + p2*(1-p2)/n2)
# standard error :
# pt <- 48/57
# pc <- 42/52
# nt <- 57
# nc <- 52
# SE <- sqrt(pt*(1-pt)/nt + pc*(1-pc)/nc)
# Adult trial of Diemunsch et al. (2007), as reported in Jin et al. (2021),
# table 3: complete response in 184/293 (63.0%) on aprepitant and 154/280
# (55.0%) on ondansetron.
source:
    control: 280
    treatment: 293
    total: 573
    responses:
      control: 154
      treatment: 184
    treatment_effect: 0.07798634812286687 #difference in proportions: (184/293) - (154/280)
    standard_error: 0.04100323
# standard error :
# pt <- 184/293
# pc <- 154/280
# nt <- 293
# nc <- 280
# SE <- sqrt(pt*(1-pt)/nt + pc*(1-pc)/nc)
