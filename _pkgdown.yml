url: 'https://tristanfauvel.github.io/BExTE/'
template:
  bootstrap: 5
  bslib:
    primary: "#F7931E"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "Fira Code"}
  light-switch: true
  theme: arrow-light
  theme-dark: arrow-dark

# See https://pkgdown.r-lib.org/reference/build_articles.html
articles:
- title: Using BExTE
  desc: The functions of the BExTE interface
  contents:
  - s3_interface

- title: Simulation
  desc: Vignettes describing simulation-based estimation of OCs
  contents:
  - simulation_illustration_high_level
  - simulation/Precision_based_ESS

- title: Data generation
  desc: Data generation in simulation studies
  contents:
  - data_generation/Data_generation_botox
  - data_generation/Data_generation_belimumab
  - data_generation/Data_generation_mepolizumab
  - data_generation/Data_generation_teriflunomide
  - data_generation/Data_generation_aprepitant

- title: Methods
  desc: Borrowing methods
  contents:
  - methods/Commensurate_Power_Prior
  - methods/Commensurate_Prior
  - methods/Conditional_Power_Prior
  - methods/Egidi_Mixture_Prior
  # methods/conditional_power_prior_binary is excluded (leading
  # underscore) - it now renders correctly, but its demo loops (two
  # ~200 x 100-replicate loops requesting quantile-based posterior
  # summaries) are too slow to be worth running in CI; a performance
  # issue, not a correctness bug.
  # methods/Empirical_Bayes_Power_Prior is excluded (leading underscore):
  # model$plot_power_parameter_vs_drift() -> self$test() needs
  # target_data$sample$standard_deviation (a per-arm SD), but this
  # vignette's target_data is an ObservedTargetData, which only ever
  # carries treatment_effect_estimate/treatment_effect_standard_error
  # (the estimate and its SE, no per-arm decomposition) - there is no way
  # to recover a per-arm SD from those without assuming equal per-arm
  # variance, so this needs a real design decision, not a vignette fix.
  - methods/Gaussian_RMP
  - methods/NPP
  - methods/NPP_KL
  - methods/PDCCPP
  - Pooling
  - methods/Pooling_study
  - Separate
  # methods/Test_then_pool is excluded (leading underscore): same root
  # cause as Empirical_Bayes_Power_Prior above - model$plot_test_vs_drift()
  # -> self$test() -> self$test_pvalue() needs
  # target_data$sample$standard_deviation, but this vignette's
  # target_data is an ObservedTargetData, which has no per-arm SD.

- title: Replications
  desc: Replication of published analyses
  contents:
  - replications/Belimumab_replication
  - replications/Mepolizumab_replication


# See https://pkgdown.r-lib.org/reference/build_reference
